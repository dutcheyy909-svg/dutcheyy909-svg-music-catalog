name: Auto-Update README

on:
  push:
    branches: [ main ]

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f automation/scripts/requirements.txt ]; then
            pip install -r automation/scripts/requirements.txt
          else
            echo "No requirements file found; skipping dependency install."
          fi

      - name: Generate README
        run: |
          if [ -f automation/scripts/generate-readme.py ]; then
            python automation/scripts/generate-readme.py
          else
            echo "README generator not found; skipping README update."
          fi

      - name: Commit updated README
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Auto-update README" || echo "No changes to commit"
          git push

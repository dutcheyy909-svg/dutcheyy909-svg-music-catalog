name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate Python and generate catalogue
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Check Python syntax
        run: |
          python -m compileall -q scripts

      - name: Run catalogue generator
        run: |
          python scripts/catalog_generator.py

      - name: Confirm catalogue was generated
        run: |
          test -f CATALOG.md
          echo "CATALOG.md generated successfully"

      - name: Check generated catalogue is current
        run: |
          git diff --exit-code -- CATALOG.md

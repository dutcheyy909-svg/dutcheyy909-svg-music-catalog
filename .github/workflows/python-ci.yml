name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate Python and generate catalogue
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f automation/scripts/requirements.txt ]; then
            python -m pip install -r automation/scripts/requirements.txt
          fi

          python -m pip install pytest flake8

      - name: Check Python syntax
        run: |
          python -m compileall -q automation/scripts scripts tests turbo-adventure/logic_tools

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory found; skipping tests."
          fi

      - name: Lint for syntax/runtime errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run catalogue generator
        run: |
          python scripts/catalog_generator.py

      - name: Confirm catalogue was generated
        run: |
          test -f catalog.json
          echo "catalog.json generated successfully"

      - name: Check generated catalogue is current
        run: |
          git diff --exit-code -- catalog.json

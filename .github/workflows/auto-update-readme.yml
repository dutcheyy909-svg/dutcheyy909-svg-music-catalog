name: Auto-Update README

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f automation/scripts/requirements.txt ] && grep -qEv '^[[:space:]]*(#.*)?$' automation/scripts/requirements.txt; then
            python -m pip install -r automation/scripts/requirements.txt
          else
            echo "No external README generator dependencies."
          fi

      - name: Generate README
        run: python automation/scripts/generate-readme.py

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update README"
          git push

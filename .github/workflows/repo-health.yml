name: Repository Health Check

on:
  push:
    branches:
      - main

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Files
        run: ls -R

      - name: Check JSON Files
        run: |
          find . -name "*.json" -exec python -m json.tool {} \;
